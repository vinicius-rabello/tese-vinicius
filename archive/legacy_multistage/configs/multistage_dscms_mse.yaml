ROOT_FOLDER: "models/DSCMS/test_composite_loss_mse_multistage/"
DEVICE: "cuda"
NUM_WORKERS: 4

BATCH_SIZE: 32
NUM_EPOCHS: 500
LEARNING_RATE: 0.0001
