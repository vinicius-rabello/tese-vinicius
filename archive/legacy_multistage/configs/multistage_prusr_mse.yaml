# Stage-2 (multistage residual) training on top of the PRUSR mse checkpoint.
# Stage 2 always trains against the normalized residual with plain MSE,
# regardless of which loss strategy stage 1 used -- see train_multistage.py.

MODEL_NAME: "prusr"
STAGE1_CHECKPOINT: "models/PRUSR/test_composite_loss_mse_10_08_2026/output/weights/PRUSR_best.pth"
ROOT_FOLDER: "models/PRUSR/test_composite_loss_mse_multistage/"
DEVICE: "cuda"
NUM_WORKERS: 4

BATCH_SIZE: 32
NUM_EPOCHS: 500
LEARNING_RATE: 0.0001
