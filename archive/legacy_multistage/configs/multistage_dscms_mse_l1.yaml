# Stage-2 (multistage residual) training on top of the DSCMS mse checkpoint.
# Stage 2 trains against the normalized residual using an L1 (not MSE) loss --
# see train_multistage.py's STAGE2_LOSS_NORM. Checkpoint selection/scheduling
# still uses the fixed MSE "final_mse" metric, so this is directly comparable
# to the MSE-trained multistage_dscms_mse.yaml counterpart.

MODEL_NAME: "dscms"
STAGE1_CHECKPOINT: "models/DSCMS/test_composite_loss_mse_05_08_2026/output/weights/DSCMS_best.pth"
ROOT_FOLDER: "models/DSCMS/test_composite_loss_mse_multistage_l1/"
DEVICE: "cuda"
NUM_WORKERS: 4

STAGE2_LOSS_NORM: "l1"

BATCH_SIZE: 32
NUM_EPOCHS: 500
LEARNING_RATE: 0.0001
