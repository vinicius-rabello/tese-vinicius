# Stage-2 (multistage residual) training on top of the SRCNN mse_wke checkpoint.
# Stage 2 trains against the normalized residual using an L1 (not MSE) loss --
# see train_multistage.py's STAGE2_LOSS_NORM. Checkpoint selection/scheduling
# still uses the fixed MSE "final_mse" metric, so this is directly comparable
# to the MSE-trained multistage_srcnn_mse_wke.yaml counterpart.

MODEL_NAME: "srcnn"
STAGE1_CHECKPOINT: "models/SRCNN/test_composite_loss_mse_wke_0.6_0.4/19_08_2026_120007/output/weights/SRCNN_best.pth"
ROOT_FOLDER: "models/SRCNN/test_composite_loss_mse_wke_0.6_0.4_multistage_l1/"
DEVICE: "cuda"
NUM_WORKERS: 4

STAGE2_LOSS_NORM: "l1"

BATCH_SIZE: 32
NUM_EPOCHS: 500
LEARNING_RATE: 0.0001
